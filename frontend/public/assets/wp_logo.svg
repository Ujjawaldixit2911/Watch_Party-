<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="24" y="24" width="464" height="464" rx="120" ry="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="20" />

  <!-- Ambient Internal Glow -->
  <circle cx="160" cy="160" r="140" fill="#a855f7" opacity="0.25" filter="url(#glow)" />
  <circle cx="360" cy="360" r="140" fill="#22d3ee" opacity="0.2" filter="url(#glow)" />

  <!-- Stylish Bold Interlocking "WP" Lettering -->
  <g filter="url(#glow)">
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
          fill="url(#textGrad)"
          font-family="system-ui, -apple-system, sans-serif"
          font-weight="900"
          font-size="220"
          letter-spacing="-12">WP</text>
  </g>
</svg>
